# Locatiepagina (teksten Annick, 23 nov 2026). Adres en links: settings.yml.
seo:
  titel: Locatie
  omschrijving: SLAAP2027 vindt plaats in NH Conference Centre Koningshof in Veldhoven. Adres, route, parkeren, openbaar vervoer en overnachten.
hero:
  titel: Alles onder één dak
  alineas:
    - SLAAP2027 vindt op 11 en 12 november 2027 plaats in NH Conference Centre Koningshof in Veldhoven, vlak bij Eindhoven. Dit voormalige klooster, omgeven door groen, biedt alle ruimte voor twee dagen vol wetenschap, ontmoeting en inspiratie.
    - "Van de plenaire sessies en symposia tot de sponsormarkt, het congresdiner en de feestavond: alles vindt plaats onder één dak. Ook overnachten kan op de congreslocatie."
adres:
  titel: Adres
  knop: Plan je route
  kaart_titel: Kaart van NH Conference Centre Koningshof in Veldhoven
bereikbaarheid:
  titel: Bereikbaarheid
  items:
    - titel: Met de auto
      tekst: NH Koningshof is goed bereikbaar via de A2 en A67. Het congrescentrum beschikt over een eigen parkeerterrein.
    - titel: Met het openbaar vervoer
      tekst: Vanaf station Eindhoven Centraal rijdt bus 19/319 naar NH Koningshof. De rit duurt ongeveer 15 minuten.
    - titel: Vanaf Eindhoven Airport
      tekst: Vanaf Eindhoven Airport reis je met het openbaar vervoer via Eindhoven of met een taxi naar NH Koningshof. De taxirit duurt doorgaans ongeveer 15 minuten, afhankelijk van het verkeer.
overnachten:
  titel: Overnachten
  tekst: Wil je na een congresdag, het diner en de feestavond niet meer naar huis reizen? NH Koningshof beschikt over ruim 500 hotelkamers op de congreslocatie. De boekingslink volgt binnenkort.
  knop: Hotel boeken
