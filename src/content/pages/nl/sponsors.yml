cgr:
  titel: Gedragscode Geneesmiddelenreclame (CGR)
  tekst1: Het publiek van SLAAP2027 bestaat uit professionals en niet-professionals. Daarom is alleen corporate branding toegestaan, zonder productinformatie. Op de badges staat de functie van deelnemers, zodat je gerichte gesprekken kunt voeren.
  tekst2: Sponsorbijdragen dekken uitsluitend de organisatiekosten en het wetenschappelijke programma. Een eventueel overschot uit registratiegelden gaat naar Stichting Slaap Congres Nederland voor toekomstige congressen. We handelen volgens de AVG en de [Gedragscode Geneesmiddelenreclame](https://www.cgr.nl).
