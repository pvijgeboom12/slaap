  omschrijving: Vragen over SLAAP2027? Neem contact op met het congressecretariaat via info@slaapcongres.nl of het contactformulier.
hero:
  titel: Vragen over SLAAP2027?
  lead: Heb je een vraag over het congresprogramma, het indienen van een symposium of abstract, de registratie of de mogelijkheden voor sponsoring? Het congressecretariaat helpt je graag verder.
  email_label: "E-mail:"
