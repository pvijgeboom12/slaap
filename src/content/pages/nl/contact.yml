sponsoring:
  titel: Word partner van SLAAP2027
  tekst: SLAAP2027 biedt bedrijven en organisaties de gelegenheid om in contact te komen met onderzoekers, clinici en andere professionals uit het Nederlandse slaapveld. Wil je jouw organisatie, producten of innovaties onder de aandacht brengen en nieuwe contacten leggen?
  oproep: De sponsor- en exposantenpakketten voor 2027 zijn binnenkort beschikbaar. Neem gerust contact met ons op via
  oproep_na: " om de mogelijkheden te bespreken."
  knop: Informeer naar de sponsormogelijkheden
  onderwerp: Sponsormogelijkheden SLAAP2027
organisatie:
  titel: Organisatie
  tekst: "SLAAP2027 wordt georganiseerd door Stichting Slaap Congres Nederland (SSCN), een samenwerking van:"
  leden:
    - Nederlandse Vereniging voor Slaap- en Waakonderzoek ([NSWO](https://www.nswo.nl/))
    - Slaapgeneeskunde Vereniging Nederland ([SVNL](https://www.slaapgeneeskundevereniging.nl/))
  slot: Het bestuur van SSCN vormt tevens de programmacommissie. De praktische congresorganisatie is in handen van JCC Congress Consultancy & Events ([www.jcc-congress.com](https://www.jcc-congress.com)).
op_de_hoogte:
  titel: Blijf op de hoogte
  tekst: Mis niets van SLAAP2027! Volg ons op LinkedIn voor nieuws over het programma, de sprekers, belangrijke deadlines en de opening van de registratie.
  knop: Volg SLAAP2027 op LinkedIn
