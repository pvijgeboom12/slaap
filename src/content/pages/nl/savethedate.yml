seo:
  titel: Save the Date
  omschrijving: SLAAP2027, het tweejaarlijkse Nederlands Slaapcongres, op 11 en 12 november 2027 in NH Koningshof, Veldhoven. Zet de datum in je agenda en lees alles over de Call for Symposia.
hero:
  kicker: Nederlands Slaapcongres
  label: Save the Date
  lead: Het tweejaarlijkse congres voor iedereen die werkt in de slaapwetenschap en slaapgeneeskunde. Zet {congresdatum} alvast in je agenda.
  knop_symposia: Call for Symposia
  knop_contact: Neem contact op
  link_route: Route plannen
intro:
  titel: Waar slaaponderzoek en slaapzorg elkaar treffen
  lead: SLAAP2027 brengt onderzoekers, clinici en zorgprofessionals uit de slaapwetenschap en slaapgeneeskunde samen. Twee dagen met keynotes, symposia, posterpresentaties en tijd om bij te praten met collega's. Er zijn Nederlandstalige en Engelstalige sessies.
  tekst: Het congres wordt om de twee jaar georganiseerd door de Nederlandse Vereniging voor Slaap-Waak Onderzoek (NSWO) en de Nederlandse Vereniging voor Slaapgeneeskunde (SVNL), onder Stichting Slaapcongres Nederland. We verwachten circa {deelnemers} deelnemers.
  voor_wie_titel: Voor wie?
  voor_wie:
    - Artsen, onderzoekers en zorgprofessionals in de slaapgeneeskunde en slaapwetenschap, lid of geen lid van NSWO of SVNL
    - (PhD-)studenten en young professionals
    - Sponsoren en exposanten uit farma en medtech
    - Iedereen met belangstelling voor slaap en waak
locatie:
  titel: Locatie
  tekst: Net als bij de vorige editie komen we samen in NH Koningshof in Veldhoven. Informatie over de route, parkeren en hotelkamers volgt later op deze site.
