  lead: Wil je een symposium organiseren op SLAAP2027? We nodigen onderzoekers, clinici en zorgprofessionals uit om een voorstel in te dienen.
  tekst: Een symposium is een sessie rond één thema, met sprekers uit jouw vakgebied. Voorstellen uit alle gebieden van de slaapwetenschap en slaapgeneeskunde zijn welkom.
