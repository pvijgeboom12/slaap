    gesloten: De registratie is gesloten.
  link_route: Route en hotel
blokken:
  - titel: Datum en locatie
    tekst: Woensdag 10 t/m vrijdag 12 november 2027 in NH Koningshof, Veldhoven.
    link: Route en hotel
  - titel: Programma
    tekst: Keynotes, parallelle symposia, posters met Data Blitz en het congresdiner.
    link: Bekijk het programma
  - titel: Accreditatie
    tekst: Accreditatie wordt aangevraagd bij de relevante beroepsverenigingen.
    link: Punten per vereniging
over:
  titel: Waar slaaponderzoek en slaapzorg elkaar treffen
  lead: SLAAP2027 brengt onderzoekers, clinici en zorgprofessionals uit de slaapwetenschap en slaapgeneeskunde samen. Drie dagen met keynotes, symposia, posterpresentaties en tijd om bij te praten met collega's. Er zijn Nederlandstalige en Engelstalige sessies.
  tekst: Het congres wordt om de twee jaar georganiseerd door de Nederlandse Vereniging voor Slaap-Waak Onderzoek (NSWO) en de Nederlandse Vereniging voor Slaapgeneeskunde (SVNL), onder Stichting Slaapcongres Nederland. We verwachten circa {deelnemers} deelnemers.
voor_wie:
  titel: Voor wie?
  punten:
    - Artsen, onderzoekers en zorgprofessionals in de slaapgeneeskunde en slaapwetenschap, lid of geen lid van NSWO of SVNL
    - (PhD-)studenten en young professionals
    - Sprekers en symposiumvoorzitters
    - Sponsoren en exposanten uit farma en medtech
    - Iedereen met belangstelling voor slaap en waak
beeld:
  titel: SLAAP2025 in beeld
  lead: "Een indruk van de vorige editie in NH Koningshof: keynotes, posters, ontmoetingen en het congresdiner."
  alt:
    - Keynote in de plenaire zaal
    - Deelnemers in gesprek bij de posters
    - Netwerken tijdens de pauze
    - Publiek tijdens een sessie
    - Dansvloer en band op het congresdiner
    - Uitreiking van de Piet Visser Posterprijs
