seo:
  titel: Home
  omschrijving: SLAAP2027, het tweejaarlijkse Nederlands Slaapcongres, 10 t/m 12 november 2027 in NH Koningshof, Veldhoven. Keynotes, symposia, posters en het congresdiner.
hero:
  kicker: Nederlands Slaapcongres
  lead: Het tweejaarlijkse congres voor iedereen die werkt in de slaapwetenschap en slaapgeneeskunde.
  knop_registreren: Registreren
  knop_abstract: Abstract indienen
  status:
