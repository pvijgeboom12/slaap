cgr:
  titel: Code of Conduct for Pharmaceutical Advertising (CGR)
  tekst1: The SLAAP2027 audience includes both professionals and non-professionals. Therefore only corporate branding is permitted, without product information. Badges show participants' roles, so you can have targeted conversations.
  tekst2: Sponsorship contributions cover only the organisational costs and the scientific programme. Any surplus from registration fees goes to Stichting Slaapcongres Nederland for future congresses. We comply with the GDPR and the [Code of Conduct for Pharmaceutical Advertising](https://www.cgr.nl).
