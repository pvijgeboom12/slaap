seo:
  titel: Dutch Sleep Congress
  omschrijving: SLAAP2027, the biennial congress for professionals in sleep science and sleep medicine. 11 and 12 November 2027 at NH Conference Centre Koningshof, Veldhoven, the Netherlands.
