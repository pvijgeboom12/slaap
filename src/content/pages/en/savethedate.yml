# NOG VERTALEN: tijdelijk de Nederlandse tekst van Annick (23 november 2026).
# Homepage in fase 1. Teksten van Annick (Websiteteksten SLAAP2027, 23 november 2026).
# Codes tussen accolades worden ingevuld vanuit Instellingen congres: {congresdatum}, {locatie}, {opening_abstracts}, {deadline_symposia}
seo:
  titel: Slaapcongres Nederland
  omschrijving: SLAAP2027, het tweejaarlijkse congres voor iedereen die werkt in de slaapwetenschap en slaapgeneeskunde. 11 en 12 november 2027 in NH Conference Centre Koningshof, Veldhoven.
hero:
  kicker: Slaapcongres Nederland
  label: Save the Date
  lead: Het tweejaarlijkse congres voor iedereen die werkt in de slaapwetenschap en slaapgeneeskunde.
  knop_symposia: Dien een symposium in
  link_locatie: Bekijk de locatie
intro:
  titel: Waar slaaponderzoek en slaapzorg samenkomen
  lead: Op 11 en 12 november 2027 komt het Nederlandse slaapveld opnieuw samen tijdens SLAAP2027. Twee dagen vol nieuwe inzichten, wetenschappelijke ontwikkelingen en praktische toepassingen. Van fundamenteel slaaponderzoek tot diagnostiek en behandeling in de dagelijkse praktijk.
  tekst: SLAAP2027 brengt onderzoekers, artsen, psychologen, verpleegkundigen, technici en andere professionals samen die zich bezighouden met slaap en waak. Om kennis te delen, ervaringen uit te wisselen en elkaar te ontmoeten.
  organisatie: Het congres wordt georganiseerd door Stichting Slaap Congres Nederland (SSCN), een samenwerking van de NSWO en de SVNL.
verwachten:
  titel: Wat kun je verwachten?
  lead: Een veelzijdig programma waarin wetenschap en praktijk elkaar versterken.
  punten:
    - Inspirerende keynotes van vooraanstaande nationale en internationale sprekers.
    - Symposia in drie parallelle tracks, met onderwerpen aangedragen door het slaapveld zelf.
    - Twee sessies met mondelinge presentaties, waarin onder meer jonge onderzoekers en PhD-studenten hun onderzoek presenteren.
    - Twee posterblitssessies, waarin onderzoekers hun werk kort en krachtig onder de aandacht brengen.
    - Aandacht voor de eerste lijn, met onderwerpen die aansluiten op de dagelijkse huisartsenpraktijk.
    - Een sponsormarkt, met ontwikkelingen op het gebied van slaapdiagnostiek, technologie en behandeling.
    - Een feestelijke congresavond, met diner, live muziek en gelegenheid om collega's te ontmoeten.
  taal: Het programma bestaat uit Nederlandstalige en Engelstalige sessies. In ieder tijdslot is minimaal één Engelstalige sessie beschikbaar.
voor_wie:
  titel: Voor wie?
  tekst: SLAAP2027 is er voor iedereen die zich professioneel bezighoudt met slaap, slaaponderzoek en slaapgeneeskunde. Van ervaren specialisten tot jonge onderzoekers en van de eerste lijn tot gespecialiseerde slaapcentra. Ook professionals die vanuit andere disciplines met slaapvraagstukken te maken hebben, zijn van harte welkom.
programma:
  titel: Denk mee over het programma
  tekst: Heb jij een onderwerp dat een podium verdient? De Call for Symposia opent op {opening_abstracts}.
