  kicker: Dutch Sleep Congress
  label: Save the Date
  lead: The biennial congress for professionals in sleep science and sleep medicine.
  knop_symposia: Submit symposium
  link_locatie: Explore the venue
intro:
  titel: Where sleep science and clinical practice meet
  lead: On 11 and 12 November 2027, the Dutch sleep community will come together for SLAAP2027. Two days of scientific discoveries, new perspectives and practical insights, from fundamental sleep research to diagnosis and treatment in clinical practice.
  tekst: SLAAP2027 brings together researchers, physicians, psychologists, nurses, technicians and other professionals working in the field of sleep and wakefulness. An opportunity to share knowledge, exchange experiences and build new connections.
  organisatie: The congress is organised by the Dutch Sleep Congress Foundation (Stichting Slaap Congres Nederland, SSCN), a collaboration between the Dutch Society for Sleep-Wake Research (NSWO) and the Dutch Society for Sleep Medicine (SVNL).
verwachten:
  titel: What to expect
  lead: A diverse programme that brings science and clinical practice together.
  punten:
    - Keynote lectures by leading national and international experts.
    - Symposia across three parallel tracks, with topics proposed by the sleep community.
    - Two oral presentation sessions, providing a platform for researchers, including early-career researchers and PhD candidates.
    - Poster blitz sessions, featuring short, engaging research presentations.
    - A focus on primary care, addressing sleep-related topics relevant to general practice.
    - An industry exhibition, showcasing developments in sleep diagnostics, technology and treatment.
    - A congress evening with dinner, live music and opportunities to connect with colleagues.
  taal: The programme features sessions in both Dutch and English, with at least one English-language session in each time slot.
voor_wie:
  titel: Who should attend?
  tekst: SLAAP2027 welcomes everyone working in sleep science, sleep medicine and related fields. From experienced specialists to early-career researchers, and from primary care professionals to specialists working in dedicated sleep centres. Professionals from other disciplines who encounter sleep-related issues in their daily practice are also warmly invited to attend.
programma:
  titel: Be part of the scientific programme
  tekst: We invite researchers, clinicians and other sleep professionals to submit symposium proposals and share new insights, scientific developments and clinical expertise. The Call for Symposia opens in early December 2026.
  knop: View the Call for Symposia
locatie:
  titel: Two days to learn, share and connect
  tekst: SLAAP2027 takes place at NH Conference Centre Koningshof in Veldhoven. With the scientific programme, industry exhibition, congress dinner and accommodation all at one location, there is plenty of opportunity to connect beyond the lecture hall.
  knop: Explore the venue
