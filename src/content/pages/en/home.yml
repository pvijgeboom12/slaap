over:
  titel: Where sleep research meets sleep care
  lead: SLAAP2027 brings together researchers, clinicians and healthcare professionals in sleep science and sleep medicine. Two days of keynotes, symposia, poster presentations and time to catch up with colleagues. Sessions are held in Dutch and English.
  tekst: The congress is organised every two years by the Dutch Society for Sleep-Wake Research (NSWO) and the Dutch Society for Sleep Medicine (SVNL), on behalf of Stichting Slaapcongres Nederland. We expect around {deelnemers} participants.
voor_wie:
  titel: Who is it for?
  punten:
    - Physicians, researchers and healthcare professionals in sleep medicine and sleep science, members and non-members of NSWO or SVNL
    - (PhD) students and young professionals
    - Speakers and symposium chairs
    - Sponsors and exhibitors from pharma and medtech
    - Anyone with an interest in sleep and wakefulness
