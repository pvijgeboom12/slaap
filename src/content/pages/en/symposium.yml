kort:
  titel: In het kort
  punten:
    - 75 of 90 minuten, met maximaal 3 of 4 sprekers
    - De hoofdindiener is ook spreker en voorzitter
    - Alle sprekers hebben vooraf hun deelname bevestigd
    - Sprekers ontvangen gratis toegang op hun presentatiedag en maximaal €100 reiskosten, geen honorarium
    - "Deadline: maandag 1 februari 2027, 23.59 uur"
richtlijnen:
  titel: Richtlijnen voor symposiumvoorstellen
  blokken:
    - titel: Opzet en programma
      punten:
        - Een symposium duurt 75 of 90 minuten. De programmacommissie bepaalt de definitieve duur en plaatsing in het programma.
        - Een symposium van 75 minuten heeft maximaal drie sprekers. Bij 90 minuten zijn maximaal vier sprekers toegestaan.
        - De hoofdindiener is tevens spreker en voorzitter van het symposium.
        - Sprekers zijn bij voorkeur afkomstig uit verschillende instellingen en disciplines, zodat meerdere perspectieven aan bod komen.
        - De voertaal is Nederlands of Engels. Wanneer één of meer sprekers Engelstalig zijn, wordt het volledige symposium in het Engels verzorgd.
        - Wijzigingen in de sprekersbezetting na acceptatie zijn uitsluitend mogelijk in overleg met de programmacommissie.
        - Alle voorgestelde sprekers moeten vooraf zijn benaderd en hun deelname hebben bevestigd.
    - titel: Voorwaarden voor sprekers
      intro: "Sprekers van geselecteerde symposia ontvangen:"
      punten:
        - Gratis toegang tot het congres op de dag van hun presentatie.
        - Een reiskostenvergoeding tot maximaal €100, op basis van een vlucht in economy class of een treinreis in de 2e klas.
        - Eén hotelovernachting, geboekt door de congresorganisatie, wanneer de reisafstand meer dan 300 kilometer bedraagt.
      slot: Er wordt geen honorarium verstrekt. Deelname aan het congresdiner is niet inbegrepen. Een (mede)voorzitter die zelf geen presentatie verzorgt, komt niet in aanmerking voor bovenstaande vergoedingen. We vragen je als hoofdindiener deze voorwaarden vooraf met alle betrokken sprekers en voorzitters af te stemmen.
    - titel: Hoe worden voorstellen beoordeeld?
      intro: "De programmacommissie beoordeelt alle ingediende voorstellen op basis van de volgende criteria:"
      punten:
        - "**Inhoudelijke kwaliteit en diepgang:** een duidelijke inhoudelijke focus, met meer diepgang dan een algemeen overzicht."
        - "**Klinische relevantie:** de betekenis van het onderwerp voor diagnostiek, behandeling of de dagelijkse praktijk."
        - "**Wetenschappelijke onderbouwing:** de kwaliteit en actualiteit van de gepresenteerde kennis."
        - "**Aansluiting op het congresprogramma:** de bijdrage aan een evenwichtig en veelzijdig programma."
        - "**Vernieuwing:** nieuwe inzichten, ontwikkelingen of invalshoeken, ook ten opzichte van SLAAP2025."
        - "**Multidisciplinariteit:** samenwerking tussen disciplines en spreiding van sprekers over verschillende instellingen."
        - "**Haalbaarheid:** een realistische programmaopzet en bevestigde beschikbaarheid van de sprekers."
      slot: De programmacommissie streeft naar een gevarieerd programma waarin zowel fundamenteel onderzoek als klinische toepassingen en verschillende doelgroepen vertegenwoordigd zijn.
    - titel: Wat gebeurt er als je voorstel niet wordt geselecteerd?
      tekst:
        - Ook wanneer een symposiumvoorstel niet wordt geselecteerd, kan een afzonderlijke bijdrage interessant zijn voor het congresprogramma. De programmacommissie kan daarom één of meer sprekers uitnodigen om een individueel abstract in te dienen voor een mondelinge presentatie of poster.
        - Een dergelijke uitnodiging betekent niet dat de bijdrage automatisch wordt geaccepteerd. Het abstract moet vóór de reguliere deadline worden ingediend en doorloopt de gebruikelijke beoordelingsprocedure. De sprekersvergoedingen voor geselecteerde symposia zijn niet van toepassing op individuele abstractpresentaties.
formulier:
  titel: Indienen via het online formulier
  tekst: Je dient je voorstel in via het online formulier. Daar zie je precies welke gegevens we vragen, zoals de beschrijving, de leerdoelen en een korte bio per spreker. Je kunt tussentijds opslaan en je voorstel aanpassen tot de deadline.
  deadline: "**Deadline:** maandag 1 februari 2027 om 23.59 uur."
vragen:
  titel: Vragen over je voorstel?
  tekst: Heb je vragen over de indieningsprocedure, de voorwaarden of het formulier? Neem gerust contact op met het congressecretariaat via
