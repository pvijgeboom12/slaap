# Submit a symposium page (Call for Symposia). English texts from Annick (24 November 2026).
# The buttons link to abstracts.link_symposium in the congress settings (Eventira form, link to follow from Annick).
seo:
  titel: Submit a symposium
  omschrijving: Call for Symposia SLAAP2027. Submit a symposium proposal before 1 February 2027 for the congress on 11 and 12 November 2027.
hero:
  titel: Call for Symposia SLAAP2027
  lead: The SLAAP2027 programme committee invites researchers, clinicians and other professionals to submit a symposium proposal for the congress on 11 and 12 November 2027.
  tekst: We are looking for strong, innovative and clinically relevant symposia that contribute to knowledge exchange and collaboration in sleep science and sleep medicine. Special attention goes to the link between scientific research and daily clinical practice. Proposals from all disciplines and fields within sleep are welcome.
  oproep: Do you have a topic that deserves a stage? Submit your proposal!
knop: Submit your symposium
knop_binnenkort: Submissions open on {opening_abstracts}.
knop_gesloten: Symposium submissions are closed.
