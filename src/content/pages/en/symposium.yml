kort:
  titel: At a glance
  punten:
    - 75 or 90 minutes, with a maximum of 3 or 4 speakers
    - The lead submitter is also a speaker and the chair
    - All speakers have confirmed their participation in advance
    - Speakers receive free access on the day of their presentation and up to €100 in travel costs, no fee
    - "Deadline: Monday 1 February 2027, 23:59 CET"
richtlijnen:
  titel: Guidelines for symposium proposals
  blokken:
    - titel: Format and programme
      punten:
        - A symposium lasts 75 or 90 minutes. The programme committee decides on the final length and position in the programme.
        - A 75-minute symposium has a maximum of three speakers. A 90-minute symposium may have up to four speakers.
        - The lead submitter is also a speaker and chairs the symposium.
        - Speakers should preferably come from different institutions and disciplines, so that several perspectives are represented.
        - The language is Dutch or English. If one or more speakers present in English, the entire symposium will be held in English.
        - Changes to the speaker line-up after acceptance are only possible in consultation with the programme committee.
        - All proposed speakers must have been approached in advance and have confirmed their participation.
    - titel: Speaker conditions
      intro: "Speakers in selected symposia receive:"
      punten:
        - Free access to the congress on the day of their presentation.
        - Reimbursement of travel costs up to €100, based on an economy class flight or a second-class train journey.
        - One hotel night, booked by the congress organisation, if the travel distance is more than 300 kilometres.
      slot: No speaker fee is paid. The congress dinner is not included. A (co-)chair who does not give a presentation is not eligible for the above reimbursements. As lead submitter, we ask you to agree these conditions in advance with all speakers and chairs involved.
    - titel: How are proposals assessed?
      intro: "The programme committee assesses all proposals on the following criteria:"
      punten:
        - "**Quality and depth of content:** a clear focus, with more depth than a general overview."
        - "**Clinical relevance:** the significance of the topic for diagnosis, treatment or daily practice."
        - "**Scientific basis:** the quality and topicality of the knowledge presented."
        - "**Fit with the congress programme:** the contribution to a balanced and varied programme."
        - "**Innovation:** new insights, developments or perspectives, also compared with SLAAP2025."
        - "**Multidisciplinarity:** collaboration between disciplines and a spread of speakers across institutions."
        - "**Feasibility:** a realistic programme and confirmed availability of the speakers."
      slot: The programme committee aims for a varied programme that represents fundamental research, clinical applications and a range of target audiences.
    - titel: What happens if your proposal is not selected?
      tekst:
        - Even if a symposium proposal is not selected, an individual contribution may still be of interest for the congress programme. The programme committee may therefore invite one or more speakers to submit an individual abstract for an oral or poster presentation.
        - Such an invitation does not mean the contribution will automatically be accepted. The abstract must be submitted before the regular deadline and goes through the standard review procedure. The speaker conditions for selected symposia do not apply to individual abstract presentations.
formulier:
  titel: Submit via the online form
  tekst: You submit your proposal through the online form. It shows exactly what information we ask for, such as the description, the learning objectives and a short bio for each speaker. You can save your proposal as a draft and make changes until the deadline.
  deadline: "**Deadline:** Monday 1 February 2027, 23:59 CET."
