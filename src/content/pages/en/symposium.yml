richtlijnen:
  titel: Guidelines for symposium proposals
  blokken:
    - titel: Format and programme
      punten:
        - Symposia last either 75 or 90 minutes. The programme committee determines the final duration and scheduling.
        - A 75-minute symposium may include up to three speakers, while a 90-minute symposium may include up to four speakers. Chairs who do not give a presentation are not counted towards this maximum.
        - Each symposium may have up to two chairs.
        - The lead submitter serves as the main point of contact for the programme committee and is responsible for communicating all relevant information and decisions to those involved. The lead submitter may also act as a chair and/or speaker, but this is not mandatory.
        - Each individual may submit up to two symposium proposals as lead submitter and present in up to two symposia.
        - Speakers should preferably come from different institutions and disciplines, so that several perspectives are represented.
        - The language is Dutch or English. If one or more speakers present in English, the entire symposium will be held in English.
        - Changes to the speaker line-up after acceptance are only possible in consultation with the programme committee.
        - All proposed speakers must have been approached in advance and have confirmed their participation.
      tekst:
        - The programme committee determines the day and time slot of each symposium. We therefore ask all speakers to be available on both congress days. If a speaker is unavailable on either day, please indicate this in the submission form.
        - Symposia must be scientifically independent and free from commercial or promotional content. Wherever possible, generic names should be used rather than brand or product names. Sponsored sessions are scheduled separately within the programme.
        - In consultation with the lead submitter, the programme committee reserves the right to modify a proposal, combine it with another proposal or adjust its duration.
    - titel: Speaker benefits and conditions
      intro: "Speakers in selected symposia will receive:"
      punten:
        - complimentary congress registration for the day of their presentation;
        - reimbursement of travel expenses up to €100, upon submission of an expense claim, based on economy-class air travel or second-class rail travel;
        - one night of hotel accommodation, booked by the congress organisers, if the travel distance exceeds 300 kilometres (one way).
      tekst:
        - No honorarium will be paid. Attendance at the congress dinner is not included. Chairs and lead submitters who do not give a presentation are not eligible for complimentary registration, travel reimbursement or hotel accommodation. The lead submitter is responsible for communicating and agreeing these conditions with everyone involved prior to submission.
        - Following acceptance, speakers will receive a personal registration link in the first half of 2027. Speakers wishing to attend the other congress day may register at a reduced rate.
        - If a speaker is unable to attend, please notify us in writing as soon as possible at info@slaapcongres.nl. Replacement speakers are subject to approval by the programme committee.
        - By submitting a proposal, you agree to the publication of the symposium title and description, as well as the speakers' names, professional positions and biographies, in the congress programme, on the website and in the congress app.
    - titel: How are proposals assessed?
      intro: "The programme committee assesses all proposals on the following criteria:"
      punten:
        - "**Quality and depth of content:** a clear focus, with more depth than a general overview."
        - "**Clinical relevance:** the significance of the topic for diagnosis, treatment or daily practice."
        - "**Scientific basis:** the quality and topicality of the knowledge presented."
        - "**Fit with the congress programme:** the contribution to a balanced and varied programme."
        - "**Innovation:** new insights, developments or perspectives, also compared with SLAAP2025."
        - "**Multidisciplinarity:** collaboration between disciplines and a spread of speakers across institutions."
        - "**Feasibility:** a realistic programme and confirmed availability of the speakers."
        - "**Coherence:** the individual contributions form a coherent and well-structured symposium."
      tekst:
        - All symposium proposals will be assessed by multiple reviewers. Based on these assessments, the programme committee will establish the final scientific programme.
      slot: The programme committee aims for a varied programme that represents fundamental research, clinical applications and a range of target audiences.
    - titel: What happens if your proposal is not selected?
      tekst:
        - Even if a symposium proposal is not selected, individual contributions may still be of interest to the scientific programme. In the submission form, each speaker is asked whether their contribution may be considered individually in the event that the symposium is not selected. The programme committee may subsequently invite these speakers to submit an individual abstract for an oral or poster presentation.
        - Such an invitation does not guarantee acceptance. Abstracts must be submitted before the Call for Abstracts deadline and will undergo the standard review process. The dates of the Call for Abstracts will be announced at a later stage. The speaker benefits offered to selected symposium speakers do not apply to individual abstract presentations.
formulier:
  titel: Submit your proposal
  tekst: "Symposium proposals must be submitted via the online submission form. You will be asked to provide:"
  punten:
    - an overall description of the symposium (approximately 300 words);
    - a brief description of each speaker's contribution (approximately 100 words, rather than a full abstract);
    - an explanation of how the individual contributions form a coherent symposium;
    - the learning objectives and intended audience (e.g. introductory, advanced or primary care);
    - a short biography and a conflict of interest declaration for each speaker.
  slot: This information will also be used for congress accreditation purposes. You can save your proposal as a draft and make changes until the submission deadline. No further changes can be made after the deadline.
  deadline: "**Deadline:** Monday, 1 February 2027, 23:59 CET."
