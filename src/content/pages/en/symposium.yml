# NOG VERTALEN: tijdelijk de Nederlandse tekst van Annick (23 november 2026).
# Pagina Symposium indienen (Call for Symposia). Teksten van Annick (23 november 2026).
# De knoppen linken naar abstracts.link_symposium in Instellingen congres (Eventira-formulier, link volgt van Annick).
seo:
  titel: Symposium indienen
  omschrijving: Call for Symposia SLAAP2027. Dien vóór 1 februari 2027 een symposiumvoorstel in voor het congres op 11 en 12 november 2027.
hero:
  titel: Call for Symposia SLAAP2027
  lead: De programmacommissie van SLAAP2027 nodigt onderzoekers, clinici en andere professionals uit om een symposiumvoorstel in te dienen voor het congres op 11 en 12 november 2027.
  tekst: We zoeken inhoudelijk sterke, vernieuwende en klinisch relevante symposia die bijdragen aan kennisuitwisseling en samenwerking binnen de slaapwetenschap en slaapgeneeskunde. Bijzondere aandacht gaat uit naar de verbinding tussen wetenschappelijk onderzoek en de dagelijkse klinische praktijk. Voorstellen uit alle disciplines en aandachtsgebieden binnen het slaapveld zijn welkom.
  oproep: Heb jij een onderwerp dat een podium verdient? Dien je voorstel in!
knop: Dien je symposium in
knop_binnenkort: Indienen kan vanaf {opening_abstracts}.
knop_gesloten: Het indienen van symposiumvoorstellen is gesloten.
