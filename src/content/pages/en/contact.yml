  opnieuw: Send another message
  fout_ontbreekt: "Please fill in:"
  fout_email: Please check your email address, for example name@hospital.org.
  fout_verzenden: Sending failed. Please try again later or email us directly.
  fout_spam: Please confirm that you are not a robot first.
zijbalk:
  organisatie_titel: Congress management
  snel_titel: Quick help
  snel:
    - Questions about registration and fees
    - Abstracts and posters
