# Contact page. English texts from Annick (24 November 2026).
seo:
  titel: Contact
  omschrijving: Questions about SLAAP2027? Contact the congress secretariat at info@slaapcongres.nl or use the contact form.
hero:
  titel: Questions about SLAAP2027?
  lead: Do you have a question about the congress programme, submitting a symposium or abstract, registration or sponsorship opportunities? The congress secretariat will be happy to help.
  email_label: "Email:"
