# Contact page. English texts from Annick (24 November 2026).
seo:
  titel: Contact
  omschrijving: Questions about SLAAP2027? Contact the congress secretariat at info@slaapcongres.nl or use the contact form.
hero:
  titel: Questions about SLAAP2027?
  lead: Do you have a question about the congress programme, submitting a symposium or abstract, registration or sponsorship opportunities? The congress secretariat will be happy to help.
  email_label: "Email:"
formulier:
  titel: Send us a message
  intro: You can also use the contact form below.
  verplicht: Fields marked * are required.
  voornaam: First name
  achternaam: Last name
  email: Email address
  organisatie: Organisation
  bericht: Message
  knop: Send message
  bezig: Sending…
  bedankt: Thank you,
  bevestiging: Your message has been sent. We will reply as soon as possible.
  opnieuw: Send another message
  fout_ontbreekt: "Please fill in:"
  fout_email: Please check your email address, for example name@hospital.org.
  fout_verzenden: Sending failed. Please try again later or email us directly.
  fout_spam: Please confirm that you are not a robot first.
  privacy: Please read our [privacy statement](/en/privacy-statement/) to learn how we process your personal data.
zijbalk:
  organisatie_titel: Congress management
  snel_titel: Quick help
  snel:
    - Questions about registration and fees
    - Abstracts and posters
    - Sponsorship and stands
    - Directions and hotel
sponsoring:
  titel: Partner with SLAAP2027
  tekst: |-
    SLAAP2027 offers companies and organisations an opportunity to connect with researchers, clinicians and other professionals from across the Dutch sleep community.

    Would you like to showcase your organisation, products or innovations and establish new professional connections?
  oproep: Our 2027 sponsorship and exhibition packages will be available soon. Please feel free to contact us at
  oproep_na: " to explore the opportunities."
  knop: Enquire about sponsorship
  onderwerp: Sponsorship opportunities SLAAP2027
organisatie:
  titel: Organisation
  tekst: "SLAAP2027 is organised by the Dutch Sleep Congress Foundation (Stichting Slaap Congres Nederland, SSCN), a collaboration between:"
  leden:
    - the Dutch Society for Sleep-Wake Research ([NSWO](https://www.nswo.nl/))
    - the Dutch Society for Sleep Medicine ([SVNL](https://www.slaapgeneeskundevereniging.nl/))
  slot: The SSCN board also acts as the programme committee. The congress is organised by JCC Congress Consultancy & Events ([www.jcc-congress.com](https://www.jcc-congress.com)).
op_de_hoogte:
  titel: Stay up to date
  tekst: Don't miss a thing! Follow SLAAP2027 on LinkedIn for news about the programme, the speakers, key deadlines and the opening of registration.
  knop: Follow SLAAP2027 on LinkedIn
