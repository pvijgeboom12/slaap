# Venue page. English texts from Annick (24 November 2026; changes 27 November 2026). Address and hotel link: congress settings.
seo:
  titel: Venue
  omschrijving: SLAAP2027 takes place on 11 and 12 November 2027 at NH Conference Centre Koningshof in Veldhoven. Address, getting there and accommodation.
hero:
  titel: Your congress venue
  lead: SLAAP2027 takes place on 11 and 12 November 2027 at NH Conference Centre Koningshof in Veldhoven, near Eindhoven. Set in green surroundings, this former monastery provides a welcoming setting for two days of scientific exchange, learning and networking.
  tekst: From plenary lectures and symposia to the industry exhibition, congress dinner and evening party, everything takes place under one roof. On-site accommodation allows you to make the most of your congress experience.
adres:
  titel: Address
  website: "[Visit the hotel website](https://www.nh-hotels.com/en/hotel/nh-eindhoven-conference-centre-koningshof)"
  knop: Plan your route
  kaart_titel: Map of NH Conference Centre Koningshof
bereikbaarheid:
  titel: Getting there
  items:
    - titel: By car
      tekst: NH Koningshof is easily reached via the A2 and A67 motorways. The conference centre has its own car park.
    - titel: By public transport
      tekst: From Eindhoven Centraal station, bus 19/319 runs to NH Koningshof. The journey takes about 15 minutes.
    - titel: From Eindhoven Airport
      tekst: From Eindhoven Airport, you can travel to NH Koningshof by public transport via Eindhoven, or by taxi. The taxi ride usually takes about 15 minutes, depending on traffic.
  toegankelijk: The congress venue is accessible to visitors with disabilities.
