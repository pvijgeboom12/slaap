# Pages CMS-configuratie voor slaapcongres.nl (SLAAP2027), fase 1 (save the date)
# Beheer: https://app.pagescms.org  (inloggen met GitHub, repo pvijgeboom12/slaap)
# Elke opslag is een commit. Op main gaat de wijziging na 2 à 4 minuten live via Cloudflare.
# Let op: Pages CMS bewaart alleen velden die hieronder staan. Voeg je een veld toe aan een
# content-bestand, zet het dan ook hier. Controle: python3 scripts/check-pages-yml.py
# De configuratie voor de volledige site (fase 2) staat klaar in docs/pages-fase-2.yml.

media:
  - name: downloads
    label: Downloads (PDF)
    input: public/downloads
    output: /downloads
    categories: [document]
    rename: safe

content:
  - name: instellingen
    label: Instellingen congres
    type: file
    path: src/content/settings.yml
    format: yaml
    fields:
      - name: congres
        label: Congres
        type: object
        fields:
          - { name: naam, label: Naam congres, type: string, required: true }
          - name: ondertitel
            label: Ondertitel
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
          - { name: startdatum, label: Eerste congresdag, type: date, required: true }
          - { name: einddatum, label: Laatste congresdag, type: date, required: true }
          - { name: locatie, label: Locatie, type: string, required: true }
          - { name: locatie_kort, label: Locatie (kort), type: string }
          - { name: locatie_volledig, label: Locatie (volledige naam), type: string }
          - { name: adres, label: Straat en huisnummer, type: string }
          - { name: postcode, label: Postcode, type: string }
          - { name: plaats, label: Plaats, type: string }
          - { name: verwachte_deelnemers, label: Verwacht aantal deelnemers, type: number }
      - name: registratie
        label: Registratie
        type: object
        fields:
          - &status
            name: status
            label: Status
            description: "Binnenkort = openingsdatum tonen. Open = knoppen naar het platform van JCC. Gesloten = korte melding."
            type: select
            required: true
            options:
              values:
                - { value: binnenkort, label: Binnenkort }
                - { value: open, label: Open }
                - { value: gesloten, label: Gesloten }
          - { name: opent_op, label: Registratie opent op, type: date }
          - { name: vroegboek_tot, label: Vroegboektarief tot en met, type: date }
          - { name: link_individueel, label: Link registratieplatform (individueel), type: string }
          - { name: link_groep, label: Link groepsregistratie, type: string }
          - { name: link_dinerticket, label: Link ticket congresdiner, type: string }
          - &melding_binnenkort
            name: melding_binnenkort
            label: Tekst bij status binnenkort
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
          - &melding_gesloten
            name: melding_gesloten
            label: Tekst bij status gesloten
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
      - name: abstracts
        label: Abstracts
        type: object
        fields:
          - *status
          - { name: opent_op, label: Indienen kan vanaf, type: date }
          - { name: deadline_abstracts, label: Deadline abstracts, type: date }
          - { name: deadline_symposia, label: Deadline symposiumvoorstellen, type: date }
          - { name: bericht_acceptatie, label: Bericht over acceptatie, type: date }
          - { name: link_abstract, label: Link abstractplatform, type: string }
          - { name: link_symposium, label: Link symposiumvoorstel, type: string }
          - *melding_binnenkort
          - *melding_gesloten
      - name: downloads
        label: Downloads (PDF)
        type: object
        fields:
          - { name: programma_pdf, label: Programma, type: file, options: { media: downloads } }
          - { name: posteroverzicht_pdf, label: Posteroverzicht, type: file, options: { media: downloads } }
          - { name: voorwaarden_registratie_pdf, label: Algemene voorwaarden registratie, type: file, options: { media: downloads } }
          - { name: voorwaarden_abstracts_pdf, label: Voorwaarden abstracts, type: file, options: { media: downloads } }
      - name: links
        label: Overige links
        type: object
        fields:
          - { name: hotel_boeken, label: Link hotelkamer boeken (leeg = geen knop), type: string }
          - { name: linkedin, label: Link LinkedIn-pagina SLAAP2027 (leeg = geen knop), type: string }
          - { name: algemene_voorwaarden, label: Link algemene voorwaarden (footer), type: string }
          - { name: privacyverklaring, label: Link privacyverklaring (footer), type: string }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: email, label: E-mailadres congresorganisatie, type: string, required: true }
          - { name: sponsoring_contactpersoon, label: Contactpersoon sponsoring, type: string }
          - { name: sponsoring_email, label: E-mailadres sponsoring (leeg = alleen contactformulier), type: string }

