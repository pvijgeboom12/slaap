# Pages CMS-configuratie voor slaapcongres.nl (SLAAP2027)
# Beheer: https://app.pagescms.org  (inloggen met GitHub, repo pvijgeboom12/slaap)
# Elke opslag is een commit. Op main gaat de wijziging na 2 à 4 minuten live via Cloudflare.
# Op een andere branch krijg je eerst een preview. Zie docs/beheerinstructie.md.

media:
  - name: sponsors
    label: Sponsorlogo's
    input: src/assets/uploads/sponsors
    output: /src/assets/uploads/sponsors
    categories: [image]
    rename: safe
  - name: sprekers
    label: Sprekersfoto's
    input: src/assets/uploads/sprekers
    output: /src/assets/uploads/sprekers
    categories: [image]
    rename: safe
  - name: downloads
    label: Downloads (PDF)
    input: public/downloads
    output: /downloads
    categories: [document]
    rename: safe

content:
  - name: instellingen
    label: Instellingen congres
    type: file
    path: src/content/settings.yml
    format: yaml
    fields:
      - name: congres
        label: Congres
        type: object
        fields:
          - { name: naam, label: Naam congres, type: string, required: true }
          - name: ondertitel
            label: Ondertitel
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
          - { name: startdatum, label: Eerste congresdag, type: date, required: true }
          - { name: einddatum, label: Laatste congresdag, type: date, required: true }
          - { name: locatie, label: Locatie, type: string, required: true }
          - { name: locatie_kort, label: Locatie (kort), type: string }
          - { name: locatie_volledig, label: Locatie (volledige naam), type: string }
          - { name: adres, label: Straat en huisnummer, type: string }
          - { name: postcode, label: Postcode, type: string }
          - { name: plaats, label: Plaats, type: string }
          - { name: verwachte_deelnemers, label: Verwacht aantal deelnemers, type: number }
      - name: registratie
        label: Registratie
        type: object
        fields:
          - &status
            name: status
            label: Status
            description: "Binnenkort = openingsdatum tonen. Open = knoppen naar het platform van JCC. Gesloten = korte melding."
            type: select
            required: true
            options:
              values:
                - { value: binnenkort, label: Binnenkort }
                - { value: open, label: Open }
                - { value: gesloten, label: Gesloten }
          - { name: opent_op, label: Registratie opent op, type: date }
          - { name: vroegboek_tot, label: Vroegboektarief tot en met, type: date }
          - { name: link_individueel, label: Link registratieplatform (individueel), type: string }
          - { name: link_groep, label: Link groepsregistratie, type: string }
          - { name: link_dinerticket, label: Link ticket congresdiner, type: string }
          - &melding_binnenkort
            name: melding_binnenkort
            label: Tekst bij status binnenkort
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
          - &melding_gesloten
            name: melding_gesloten
            label: Tekst bij status gesloten
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
      - name: abstracts
        label: Abstracts
        type: object
        fields:
          - *status
          - { name: opent_op, label: Indienen kan vanaf, type: date }
          - { name: deadline_abstracts, label: Deadline abstracts, type: date }
          - { name: deadline_symposia, label: Deadline symposiumvoorstellen, type: date }
          - { name: bericht_acceptatie, label: Bericht over acceptatie, type: date }
          - { name: link_abstract, label: Link abstractplatform, type: string }
          - { name: link_symposium, label: Link symposiumvoorstel, type: string }
          - *melding_binnenkort
          - *melding_gesloten
      - name: downloads
        label: Downloads (PDF)
        type: object
        fields:
          - { name: programma_pdf, label: Programma, type: file, options: { media: downloads } }
          - { name: posteroverzicht_pdf, label: Posteroverzicht, type: file, options: { media: downloads } }
          - { name: voorwaarden_registratie_pdf, label: Algemene voorwaarden registratie, type: file, options: { media: downloads } }
          - { name: voorwaarden_abstracts_pdf, label: Voorwaarden abstracts, type: file, options: { media: downloads } }
      - name: links
        label: Overige links
        type: object
        fields:
          - { name: hotel_boeken, label: Link hotelkamer boeken, type: string }
          - { name: algemene_voorwaarden, label: Link algemene voorwaarden (footer), type: string }
          - { name: privacyverklaring, label: Link privacyverklaring (footer), type: string }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: email, label: E-mailadres congresorganisatie, type: string, required: true }
          - { name: sponsoring_contactpersoon, label: Contactpersoon sponsoring, type: string }
          - { name: sponsoring_email, label: E-mailadres sponsoring (leeg = alleen contactformulier), type: string }

  - name: programma
    label: Programma
    type: file
    path: src/content/programma.yml
    format: yaml
    fields:
      - name: dagen
        label: Congresdagen
        type: object
        list: true
        fields:
          - { name: datum, label: Datum, type: date, required: true }
          - name: sessies
            label: Sessies
            type: object
            list: true
            fields:
              - { name: tijd, label: Tijd, description: "Bijv. 09.00–10.30", type: string }
              - name: type
                label: Soort sessie
                type: select
                required: true
                options:
                  values:
                    - { value: keynote, label: Keynote }
                    - { value: symposia, label: Symposia }
                    - { value: posters, label: Posters / Data Blitz }
                    - { value: plenair, label: Plenair (ook pauze en registratie) }
                    - { value: sociaal, label: Sociaal (diner) }
              - name: titel
                label: Titel
                type: object
                fields:
                  - { name: nl, label: Nederlands, type: string, required: true }
                  - { name: en, label: Engels, type: string }
              - { name: zaal, label: Zaal, type: string }
              - { name: sprekers, label: Spreker(s), description: Meerdere sprekers scheiden met een komma, type: string }
              - { name: voorzitter, label: Voorzitter, type: string }
      - name: diner
        label: Congresdiner
        type: object
        fields:
          - { name: datum, label: Datum, type: date }
          - { name: tijd, label: Vanaf (tijd), type: string }
          - { name: zaal, label: Zaal, type: string }
          - { name: bedrag, label: Prijs in euro, description: "Alleen het bedrag, bijv. 85", type: string }

  - name: sprekers
    label: Sprekers
    type: file
    path: src/content/sprekers.yml
    format: yaml
    fields:
      - name: sprekers
        label: Uitgelichte sprekers
        type: object
        list: true
        fields:
          - { name: naam, label: Naam, type: string }
          - name: type
            label: Soort
            type: select
            options:
              values:
                - { value: keynote, label: Keynote }
                - { value: symposia, label: Symposium }
          - name: functie
            label: Functie en instelling
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
          - name: lezing
            label: Titel lezing
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }
          - { name: foto, label: Foto, description: "Vierkant werkt het best", type: image, options: { media: sprekers } }
          - name: bio
            label: Korte bio
            type: object
            fields:
              - { name: nl, label: Nederlands, type: text }
              - { name: en, label: Engels, type: text }

  - name: sponsors
    label: Sponsors
    type: file
    path: src/content/sponsors.yml
    format: yaml
    fields:
      - name: sponsors
        label: Sponsors en exposanten
        description: Zolang een niveau leeg is, toont de site lege logotegels.
        type: object
        list: true
        fields:
          - { name: naam, label: Naam, type: string, required: true }
          - name: niveau
            label: Niveau
            type: select
            required: true
            options:
              values:
                - { value: platinum, label: Platinum }
                - { value: goud, label: Goud }
                - { value: zilver, label: Zilver }
                - { value: exposant, label: Exposant }
          - { name: logo, label: Logo, description: "Liefst SVG of PNG met transparante achtergrond", type: image, options: { media: sponsors } }
          - { name: link, label: Website (URL), type: string }

  - name: comite
    label: Organisatiecomité
    type: file
    path: src/content/comite.yml
    format: yaml
    fields:
      - name: leden
        label: Leden
        type: object
        list: true
        fields:
          - { name: naam, label: Naam, type: string }
          - name: functie
            label: Functie en instelling
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string }
              - { name: en, label: Engels, type: string }

  - name: accreditatie
    label: Accreditatie
    type: file
    path: src/content/accreditatie.yml
    format: yaml
    fields:
      - name: verenigingen
        label: Beroepsverenigingen
        type: object
        list: true
        fields:
          - name: naam
            label: Naam vereniging
            type: object
            fields:
              - { name: nl, label: Nederlands, type: string, required: true }
              - { name: en, label: Engels, type: string }
          - { name: punten, label: Aantal punten, type: string }


